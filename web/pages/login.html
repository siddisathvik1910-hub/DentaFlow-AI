<!doctype html>
<html lang="en">
<head>
{{> head}}
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-body">
<a class="skip" href="#main">Skip to main content</a>
<main id="main" class="login-wrap">
  <div class="login-card">
    <a class="brand" href="/" aria-label="DentaFlow AI home"><img src="/img/logo.svg" width="36" height="36" alt="">DentaFlow AI</a>
    <h1>Sign in</h1>
    <div id="login-msg" role="alert" aria-live="assertive"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required aria-describedby="email-err">
        <p class="err" id="email-err"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-err">
        <p class="err" id="password-err"></p>
      </div>
      <div class="field" id="code-field" hidden>
        <label for="code">6-digit code from your authenticator app</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="code-err">
        <p class="err" id="code-err"></p>
      </div>
      <button class="btn btn-lg" type="submit" id="login-submit">Sign in</button>
    </form>
    <p class="demo-hint" id="demo-hint" hidden>Demo account: <code>demo@brightsmile.test</code> / <code>DentaFlow!2026</code></p>
    <p><a href="/">&larr; Back to website</a></p>
  </div>
</main>
<script src="/js/login.js" defer></script>
</body>
</html>
