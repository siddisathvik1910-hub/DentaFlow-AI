<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-labelledby="t d">
<title id="t">DentaFlow AI booking a dental appointment</title>
<desc id="d">A phone screen showing a patient asking for a cleaning and the AI assistant offering Thursday at 1 PM, next to a calendar card showing the appointment booked.</desc>
<rect width="560" height="460" rx="28" fill="#eaf2fb"/>
<rect x="40" y="30" width="250" height="400" rx="30" fill="#0f2740"/>
<rect x="52" y="48" width="226" height="364" rx="20" fill="#fff"/>
<rect x="64" y="62" width="202" height="30" rx="8" fill="#0b5cad"/>
<text x="76" y="82" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Bright Smile Dental</text>
<rect x="64" y="104" width="150" height="40" rx="12" fill="#e4ebf2"/>
<text x="74" y="121" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#1b2a3a">Hi, I need a cleaning</text>
<text x="74" y="135" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#1b2a3a">this week.</text>
<rect x="84" y="156" width="182" height="58" rx="12" fill="#0b5cad"/>
<text x="94" y="174" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#fff">I have Thursday at 1:00 PM</text>
<text x="94" y="189" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#fff">with Sarah. Shall I book</text>
<text x="94" y="204" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#fff">it for you?</text>
<rect x="64" y="226" width="80" height="28" rx="12" fill="#e4ebf2"/>
<text x="76" y="244" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#1b2a3a">Yes, please!</text>
<rect x="84" y="266" width="182" height="58" rx="12" fill="#0b5cad"/>
<text x="94" y="284" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#fff">You're all set! I'm texting</text>
<text x="94" y="299" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#fff">your confirmation now.</text>
<rect x="64" y="368" width="202" height="30" rx="15" fill="#e4ebf2"/>
<rect x="320" y="70" width="200" height="150" rx="18" fill="#fff"/>
<rect x="320" y="70" width="200" height="38" rx="18" fill="#0e6b6a"/>
<rect x="320" y="90" width="200" height="18" fill="#0e6b6a"/>
<text x="336" y="95" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">Thursday, Oct 8</text>
<rect x="336" y="124" width="168" height="34" rx="8" fill="#e3f4f3"/>
<text x="346" y="139" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="700" fill="#0b4f4e">1:00 PM  Cleaning &amp; Exam</text>
<text x="346" y="152" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#0b4f4e">Sarah Kim, RDH</text>
<rect x="336" y="168" width="168" height="34" rx="8" fill="#eef1f5"/>
<text x="346" y="189" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#3b4b5c">3:30 PM  Checkup</text>
<rect x="320" y="244" width="200" height="86" rx="18" fill="#fff"/>
<circle cx="352" cy="287" r="20" fill="#0e6b6a"/>
<path d="M342 287l7 7 12-14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="382" y="282" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700" fill="#1b2a3a">Booked in 48 sec</text>
<text x="382" y="300" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#3b4b5c">Synced to schedule</text>
<rect x="320" y="352" width="200" height="60" rx="18" fill="#0f2740"/>
<text x="340" y="378" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">After-hours call captured</text>
<text x="340" y="396" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#cfe0f2">9:42 PM  new patient exam</text>
</svg>
